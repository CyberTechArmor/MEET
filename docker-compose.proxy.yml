# Docker Compose with Caddy Reverse Proxy
# Provides automatic HTTPS with Let's Encrypt

services:
  # Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Your own certificate (install.sh option 2 → "existing certificate"):
      # tls/<domain>.crt + tls/<domain>.key on the host, referenced from
      # .env as TLS_MODE="tls /certs/<domain>.crt /certs/<domain>.key".
      # Harmless (empty dir) when Let's Encrypt is used instead.
      - ${TLS_CERT_DIR:-./tls}:/certs:ro
    environment:
      - MEET_DOMAIN=${MEET_DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - TLS_MODE=${TLS_MODE:-}
    depends_on:
      - meet-frontend
      - meet-api
      - livekit
    networks:
      - meet-network

  # Frontend - React + Vite application
  # Note: Frontend auto-detects API and LiveKit URLs based on browser location
  meet-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - meet-network

  # API Server - Token generation
  meet-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_URL=http://livekit:7880
      - PORT=8080
      - CORS_ORIGIN=*
      - MEET_DATA_DIR=/data
      # Public URL of the SPA. WebAuthn derives its rpID + allowed origins
      # from this; without it the admin panel reports passkeys disabled.
      # Also used to build joinUrl for rooms created via POST /api/rooms.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://${MEET_DOMAIN:-localhost}}
    # Persistent state for the API (SQLite: admin account, passkeys, SMTP /
    # email sign-in settings, API keys, webhooks). Survives `compose down`.
    volumes:
      - meet_api_data:/data
    depends_on:
      - livekit
    restart: unless-stopped
    networks:
      - meet-network

  # LiveKit Server - WebRTC backend
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    expose:
      - "7880"  # Expose to Docker network for Caddy
    ports:
      - "7880:7880"       # WebSocket / HTTP API
      - "7881:7881"       # RTC over TCP
      - "50000-50100:50000-50100/udp"  # RTC over UDP (media)
    environment:
      # NODE_IP is read by LiveKit if set, otherwise auto-detected
      - NODE_IP=${LIVEKIT_NODE_IP:-}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped
    networks:
      - meet-network

networks:
  meet-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  meet_api_data:
